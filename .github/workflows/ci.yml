name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Compile source modules
        run: python -m compileall -q src

      - name: Run linter
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Run type checker
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: Smoke test CLI subcommands
        run: |
          chemi-cascade --help
          python -m chemi_cascade.cli analyze --smiles "CC(=O)Oc1ccccc1C(=O)O"
          python -m chemi_cascade.cli cluster --threshold 0.55
          python -m chemi_cascade.cli adme --smiles "CN1C=NC2=C1C(=O)N(C(=O)N2C)C" --epochs 15 --seed 42
          python -m chemi_cascade.cli dock --smiles "Cc1ccc(NC(=O)c2ccccc2)cc1" --seed 42
          python -m chemi_cascade.cli optimize --seed-smiles "c1ccc(Nc2ncnc3ccccc23)cc1" --generations 4 --pop-size 12 --seed 42
          python -m chemi_cascade.cli benchmark --seed 42
          python -m chemi_cascade.cli demo --seed 42

      - name: Execute standalone examples
        run: |
          python examples/01_smiles_topology_and_descriptors.py
          python examples/02_fingerprints_clustering_and_mmp.py
          python examples/03_gnn_adme_and_pbpk_kinetics.py
          python examples/04_3d_conformer_docking_and_protac.py
          python examples/05_denovo_mcts_pareto_cascade.py
