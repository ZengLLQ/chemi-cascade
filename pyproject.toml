[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemi-cascade"
version = "0.1.0"
description = "Computational cheminformatics, graph neural ADME modeling, empirical protein-ligand docking, PROTAC ternary cooperativity, and de novo molecular optimization platform."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "ZengLLQ" }
]
keywords = [
  "cheminformatics",
  "drug-discovery",
  "molecular-docking",
  "graph-neural-networks",
  "adme-prediction",
  "qsar",
  "pharmacokinetics",
  "protac",
  "de-novo-design",
  "computational-chemistry"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "flake8>=6.0.0",
  "mypy>=1.5.0"
]
ml = [
  "torch>=2.0.0"
]

[project.scripts]
chemi-cascade = "chemi_cascade.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
